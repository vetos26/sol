name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/d01d6afd-sol

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev libltdl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer 'Cython==0.29.37' setuptools wheel
      - name: Build debug APK
        run: |
          set -o pipefail
          if ! buildozer android debug 2>&1 | tee build.log; then
            echo 'Build failed; relevant errors:'
            details=$(sed $'s/\\x1b\\[[0-9;]*m//g' build.log | grep -iE 'error:|error compiling|fatal error|traceback|command failed|failed to|exit status|killed' | tail -n 25 | tr '\n' '|')
            details=${details//'%'/'%25'}
            echo "::error::$details"
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-android-debug
          path: bin/*.apk
          if-no-files-found: error
